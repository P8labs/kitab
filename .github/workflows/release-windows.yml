name: Release Windows Binary

on:
  push:
    tags:
      - "v*.*.*"

env:
  CARGO_INCREMENTAL: 0
  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

jobs:
  build-release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build SPA
        run: pnpm build

      - name: Validate updater signing secrets
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) {
            throw "Missing secret: TAURI_SIGNING_PRIVATE_KEY"
          }

      - name: Build Tauri application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseName: ${{ github.ref_name }}
          releaseBody: |
            ## Changelog
            - Release `${{ github.ref_name }}` is now available.
            - See commit history: https://github.com/${{ github.repository }}/commits/${{ github.ref_name }}

            ## Artifacts
            - Windows setup installer (.exe)
            - Windows MSI installer (.msi)
            - Portable zip (.zip)
            - Updater metadata and signatures (latest.json / .sig)

            ## Windows Install Note
            - Windows may show a warning/block screen during installation because this app is not yet registered with a commercial trust program.
            - This is an indie project and we do not currently have funding for that registration.
            - The app is safe to use and fully open source: https://github.com/${{ github.repository }}

            ## Bug Reports
            - Report issues here: https://github.com/${{ github.repository }}/issues/new/choose
          tagName: ${{ github.ref_name }}
          generateReleaseNotes: true

      - name: Create portable zip
        shell: pwsh
        run: |
          $portableDir = "src-tauri/target/release/bundle/portable"
          New-Item -ItemType Directory -Force -Path $portableDir | Out-Null

          $binaryPath = "src-tauri/target/release/kitab.exe"
          if (-not (Test-Path $binaryPath)) {
            throw "Portable binary not found at $binaryPath"
          }

          $portableBinaryPath = Join-Path $portableDir "kitab.exe"
          Copy-Item -Path $binaryPath -Destination $portableBinaryPath -Force

          $zipName = "kitab_${{ github.ref_name }}_windows_x64_portable.zip"
          $zipPath = Join-Path $portableDir $zipName
          if (Test-Path $zipPath) {
            Remove-Item $zipPath -Force
          }

          Compress-Archive -Path $portableBinaryPath -DestinationPath $zipPath
          Write-Host "Created portable zip: $zipPath"

      - name: List build artifacts
        run: |
          Write-Host "=== Build Artifacts ==="
          Get-ChildItem -Path "src-tauri/target/release/bundle/msi" -Recurse
          Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -Recurse
          Get-ChildItem -Path "src-tauri/target/release/bundle/portable" -Recurse
          Get-ChildItem -Path "src-tauri/target/release/bundle" -Filter "latest.json" -Recurse

      - name: Upload release assets
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            src-tauri/target/release/bundle/portable/*.zip
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/**/*.sig
            src-tauri/target/release/bundle/**/latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
